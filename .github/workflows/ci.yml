name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff==0.16.3"
      - name: Ruff check
        run: ruff check fusion_cowork/ tests/
      - name: Ruff format check
        run: ruff format --check fusion_cowork/ tests/
      - name: CLAIM lint (issue #188)
        run: python scripts/check_claims.py

  test-sqlite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Test (SQLite backend, default marks)
        run: python -m pytest tests/ -q --tb=short -m "not slow and not chaos and not postgres"
      - name: Coverage
        run: python -m pytest tests/ -q -m "not slow and not chaos and not postgres" --cov=fusion_cowork --cov-report=term-missing --cov-fail-under=50

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fusion
          POSTGRES_USER: fusion
          POSTGRES_DB: fusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUSION_PG_DSN: postgresql://fusion:fusion@localhost:5432/fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Test (Postgres backend integration)
        run: python -m pytest tests/ -q --tb=short -m "postgres"

  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Slow + chaos tests
        run: python -m pytest tests/ -q --tb=short -m "slow or chaos"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (web/)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint (web/)
        working-directory: web
        run: bun run lint
      - name: Typecheck (web/)
        working-directory: web
        run: bun run typecheck
      - name: Build (web/)
        working-directory: web
        run: bun run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web,office]"
      - run: pip install pip-audit
      - name: pip-audit (high/critical CVEs fail)
        run: pip-audit -f columns --ignore-vuln GHSA-xxxx
