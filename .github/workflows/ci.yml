name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# issue #429: cancel superseded runs on the same branch/PR — repeated push
# does not queue another full matrix behind the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # issue #429: docs/comments-only changes skip the heavy jobs. Job-level
  # conditional (not `paths-ignore`) so the required checks still report
  # (skipped = success for branch protection) instead of never appearing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'fusion_cowork/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'web/src/**'
              - 'web/tests/**'
              - 'web/package.json'
              - 'web/bun.lock'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff==0.16.3"
      - name: Ruff check
        run: ruff check fusion_cowork/ tests/
      - name: Ruff format check
        run: ruff format --check fusion_cowork/ tests/
      - name: CLAIM lint (issue #188)
        run: python scripts/check_claims.py

  test-sqlite:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # issue #429: wall time ~ suite/3 — deterministic round-robin file shards
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install fusion-harness pytest-split
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Test (SQLite backend, shard ${{ matrix.shard }}/3)
        run: |
          python -m pytest tests/ -q --tb=short --timeout=600 --timeout-method=thread \
            -m "not slow and not chaos and not postgres" \
            --splits 3 --group ${{ matrix.shard }} --splitting-algorithm=least_duration

  # issue #429: coverage ran the full suite 6 extra times (one per matrix leg);
  # one dedicated leg keeps the --cov-fail-under gate at 1/7 of the cost
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install fusion-harness pytest-split
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Coverage (full suite, single leg)
        run: python -m pytest tests/ -q --timeout=600 --timeout-method=thread -m "not slow and not chaos and not postgres" --cov=fusion_cowork --cov-report=term-missing --cov-fail-under=50

  test-postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fusion
          POSTGRES_USER: fusion
          POSTGRES_DB: fusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUSION_PG_DSN: postgresql://fusion:fusion@localhost:5432/fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install fusion-harness
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Test (Postgres backend integration)
        run: python -m pytest tests/ -q --tb=short --timeout=600 --timeout-method=thread -m "postgres"

  test-slow:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install fusion-harness pytest-split
      - run: pip install -e ".[test,cloud,web,office]"
      - name: Slow + chaos tests
        run: python -m pytest tests/ -q --tb=short --timeout=600 --timeout-method=thread -m "slow or chaos"

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-bun downloads from GitHub release assets, which 504'd for 2h on
      # 2026-11-08 and blocked every PR — npm registry is an independent CDN
      - name: Install bun
        run: npm install -g bun
      - name: Install (web/)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint (web/)
        working-directory: web
        run: bun run lint
      - name: Test (web/)
        working-directory: web
        run: bun run test
      - name: Typecheck (web/)
        working-directory: web
        run: bun run typecheck
      - name: Build (web/)
        working-directory: web
        run: bun run build

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install fusion-harness
      - run: pip install -e ".[test,cloud,web,office]"
      - run: pip install pip-audit
      - name: pip-audit (high/critical CVEs fail)
        run: pip-audit -f columns --ignore-vuln GHSA-xxxx
