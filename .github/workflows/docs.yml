name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-cowork \
            --class platform --entry service \
            --skip-dirs ".git,.venv,.pytest_cache,.ruff_cache,.atomcode,.remember,.claude,node_modules,browser,logs,fusion_cowork.egg-info,skills,web/node_modules"
