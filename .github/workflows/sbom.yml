name: SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web]"
      - run: pip install cyclonedx-bom pip-audit

      - name: Generate CycloneDX SBOM
        run: |
          # cyclonedx-py v7+ renamed --schema-version to --spec-version; pin the
          # tool so future CLI changes cannot break this workflow again.
          pip install "cyclonedx-bom>=7,<8"
          cyclonedx-py environment -o sbom.cdx.json --spec-version 1.5 \
            || { pip freeze > /tmp/freeze.txt && cyclonedx-py requirements -i /tmp/freeze.txt -o sbom.cdx.json --spec-version 1.5; }

      - name: pip-audit report
        run: pip-audit -f json -o pip-audit.json || true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-cowork-sbom
          path: |
            sbom.cdx.json
            pip-audit.json
          retention-days: 30
