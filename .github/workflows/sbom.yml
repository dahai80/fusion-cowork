name: SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,cloud,web]"
      - run: pip install cyclonedx-bom pip-audit

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom.cdx.json --schema-version 1.5 || \
          cyclonedx-py requirements -i <(pip freeze) -o sbom.cdx.json

      - name: pip-audit report
        run: pip-audit -f json -o pip-audit.json || true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-cowork-sbom
          path: |
            sbom.cdx.json
            pip-audit.json
          retention-days: 30
