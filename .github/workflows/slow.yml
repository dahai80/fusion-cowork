name: Slow Suite

# P3-5 (audit v4): the @slow/@chaos suites (load / e2e / chaos) are NOT part
# of the PR gate — they run on a weekly schedule and on demand so a release
# always has fresh performance/recovery evidence without slowing merges.
on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Run @slow suite
        run: pytest tests/ -m slow -v --timeout=1200
      - name: Run @chaos suite
        run: pytest tests/ -m chaos -v --timeout=1200
