apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: fusion-cowork
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # 生产环境: 用 external-secrets / sealed-secrets 覆盖, 勿提交真值
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  pgDsn: {{ .Values.secrets.pgDsn | quote }}
