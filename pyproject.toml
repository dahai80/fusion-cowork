[project]
name = "fusion-cowork"
version = "0.1.7"
description = "Fusion-Cowork — macOS 原生、本地优先、零代码桌面智能自动化平台"
authors = [
    { name = "Fusion-MLX Team" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
dev = [
    "fusion-cowork[test,web]",
]

[project.scripts]
fusion-cowork = "fusion_cowork.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_cowork"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
include = ["fusion_cowork*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["fusion_cowork", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "RUF006", "RUF012", "RUF013", "RUF022", "RUF034", "RUF059", "UP006", "UP035", "UP042", "UP045", "SIM102", "SIM103", "SIM105", "SIM108", "SIM115", "B007", "B905", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_cowork"]

[tool.black]
target-version = ["py311"]
line-length = 120

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"